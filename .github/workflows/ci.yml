name: ci
on: [push, pull_request]
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, intl, pdo_sqlite' }
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @frameloom/extension build
        env: { WXT_E2E: "1" }
      - run: pnpm --filter @frameloom/extension exec playwright install chromium
      - run: pnpm --filter @frameloom/extension e2e
        env: { CHROMIUM_PATH: "" }
      - run: pnpm audit --prod --audit-level high
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mbstring, intl, pdo_sqlite }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: composer require --dev larastan/larastan:^3 --no-interaction -W
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test
      - run: php artisan scramble:export --path=../../packages/api-client/openapi.json
      - run: git diff --exit-code ../../packages/api-client/openapi.json
      - run: composer audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
