name: ci
on:
  push:
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, intl, pdo_sqlite, zip' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      - name: Typecheck
        run: pnpm typecheck
      - name: Shared tests, evals and coverage gate (85%)
        run: pnpm --filter @frameloom/shared test
      - name: Extension unit tests and coverage gate
        run: pnpm --filter @frameloom/extension exec vitest run --coverage
      - name: Build for e2e
        run: pnpm --filter @frameloom/extension build
        env: { WXT_E2E: "1" }
      - run: pnpm --filter @frameloom/extension exec playwright install --with-deps chromium
      - name: End-to-end (real Laravel server, mock providers)
        run: pnpm --filter @frameloom/extension e2e
      - name: Production build, size budget and zip
        run: |
          rm -rf apps/extension/.output
          pnpm --filter @frameloom/extension zip
          node apps/extension/scripts/check-budget.mjs
        env: { WXT_API_BASE: "https://api.example.invalid" }
      - uses: actions/upload-artifact@v4
        with: { name: extension-zip, path: apps/extension/.output/*.zip }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_DATABASE: frameloom_test, MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, intl, pdo_sqlite, pdo_mysql, zip', coverage: pcov }
      - run: composer install --no-interaction --prefer-dist
      - run: composer require --dev larastan/larastan:^3 --no-interaction -W
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Tests with coverage gate (80%)
        run: php artisan test --coverage --min=80
      - name: Migrate against MySQL 8
        run: php artisan migrate --force
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_PORT: "3306", DB_DATABASE: frameloom_test, DB_USERNAME: root, DB_PASSWORD: root }
      - name: OpenAPI drift check
        run: |
          php artisan scramble:export --path=../../packages/api-client/openapi.json
          git diff --exit-code ../../packages/api-client/openapi.json
      - run: composer audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
